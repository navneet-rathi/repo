---
- name: demo playbook
  hosts: all
  tasks:
    - name: Print a message
      debug:
        msg: "{{  val1 }}"

- name: demo playbook
  hosts: app
  tasks:
    - name: Print a message
      debug:
        msg: "{{ var2 }}"

    - name: print a message
      debug:
        msg: "{{ item.0 }} match {{ item.1 }}"
      loop: "{{ var3 | zip(var4) | list }}"
    
    - name: copy a file
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/{{item}}"
        mode: '0755'
      loop: 
        - app.sh
        - app1.sh
        - db.sh
        - final.sh

    - name: Execute a shell command
      shell: "/tmp/final.sh"
      register: command_output

    - name: Print the command output
      debug:
        msg: "{{ command_output.stdout_lines }}"